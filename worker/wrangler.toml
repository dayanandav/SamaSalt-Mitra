name = "samasalt-mitra"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Static web app (public/). /api/* is handled by the Worker first.
[assets]
directory = "../public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/k/*", "/v/*", "/o/*"]

# Reference data + anonymous impact log (free tier).
[[d1_databases]]
binding = "DB"
database_name = "samasalt-mitra"
database_id = "ad0b146e-7c60-448d-ab68-ee460ca1909f"
migrations_dir = "migrations"

# v1.1 Kendra registry: "off" | "pilot" (registered numbers shown to test traffic only, until
# PMBJP agrees) | "public".
[vars]
KENDRA_REGISTRY = "pilot"
# v1.2 order requests (WhatsApp/SMS to a registered Kendra, pickup only): "pilot" = test traffic only,
# until PMBI confirms reserve-and-collect fits PMBJP rules; then "public".
ORDER_REQUESTS = "pilot"
# v1.3 registered volunteers: "off" (parked by the owner, 17 Nov 2026: join section, console tab and
# registration hidden/refused) | "on". Volunteer mode itself (/volunteer guide, ?volunteer=1) always works.
VOLUNTEER_REGISTRY = "off"
# v2.0 WhatsApp bot: "off" | "on". Needs secrets WA_TOKEN, WA_PHONE_ID, WA_APP_SECRET, WA_VERIFY_TOKEN
# (and WA_HASH_KEY) and the webhook https://<site>/api/wa/webhook set in the Meta app.
WHATSAPP_BOT = "off"
# The bot's WhatsApp number (digits with country code, e.g. 919876543210) for the home screen's
# "Ask on WhatsApp" button; the button shows only when WHATSAPP_BOT is "on" and this is set.
WA_BOT_NUMBER = ""
# v2.0.1 Chat in the app (home screen → Chat; the bot's conversation without WhatsApp): "off" | "on".
# Needs migration 0007 (wa_chats).
APP_CHAT = "on"

# Own domain (docs/DOMAIN.md): once the domain serves this Worker, set it here (e.g. "samasaltmitra.in")
# and old workers.dev links (QR posters, shared links, the app) move to it. "" = stay on workers.dev.
CANONICAL_HOST = ""

# Abuse protection (worker/src/limits.js). Photo reads per day (IST) before patients are asked to type
# the name instead, so a flood cannot use up the free Workers AI allocation. "" = no cap.
DAILY_PHOTO_LIMIT = "1500"

# /impact figures are made again after this many minutes (they read every lookup). "" = every time.
IMPACT_CACHE_MIN = "60"

# Per-address request limits (Cloudflare Rate Limiting; the address is a counter key only, never
# stored). Checks: /api/ask, /api/chat, /api/feedback, /api/wa/simulate. Login: /api/admin/login.
[[ratelimits]]
name = "LIMIT_CHECK"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "LIMIT_LOGIN"
namespace_id = "1002"
simple = { limit = 8, period = 60 }

# Own domain (docs/DOMAIN.md), after it is added to this Cloudflare account:
# routes = [{ pattern = "samasaltmitra.in", custom_domain = true }, { pattern = "www.samasaltmitra.in", custom_domain = true }]

# Vision + text models (Workers AI free allocation).
[ai]
binding = "AI"

[observability]
enabled = true

# Prompts are authored in AgentFoundry (.codenow/agent-studio/prompts/*.md) and bundled as text.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# ── Test environment (staging) ───────────────────────────────────────────────
# A separate Worker and database for end-to-end testing before a stage goes live:
#   npx wrangler deploy --env staging
#   https://samasalt-mitra-staging.<subdomain>.workers.dev
# Its own D1 (copy of the Jan Aushadhi data + made-up TEST Kendras PMBJK990xx), its own
# ADMIN_TOKEN secret (npx wrangler secret put ADMIN_TOKEN --env staging), the registry public,
# and a "Test environment" banner on every page. Nothing here touches the live site's data.
[env.staging]
name = "samasalt-mitra-staging"

[env.staging.vars]
KENDRA_REGISTRY = "public"
ORDER_REQUESTS = "public"
VOLUNTEER_REGISTRY = "on"
WHATSAPP_BOT = "on"
WA_BOT_NUMBER = ""
APP_CHAT = "on"
DAILY_PHOTO_LIMIT = "300"
IMPACT_CACHE_MIN = "60"

[[env.staging.ratelimits]]
name = "LIMIT_CHECK"
namespace_id = "2001"
simple = { limit = 30, period = 60 }

[[env.staging.ratelimits]]
name = "LIMIT_LOGIN"
namespace_id = "2002"
simple = { limit = 8, period = 60 }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "samasalt-mitra-staging"
database_id = "6b7834cd-e27d-4509-be61-a875507908dd"
migrations_dir = "migrations"

[env.staging.ai]
binding = "AI"
