<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SamaSalt-Mitra — same medicine, lower price</title>
  <meta name="description" content="Scan a medicine strip. See every brand with the exact same salt and strength, the Jan Aushadhi price, and the nearest Jan Aushadhi Kendra. English, ಕನ್ನಡ, हिन्दी.">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/icon-128.png" type="image/png">
  <link rel="apple-touch-icon" href="/icon-256.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=optional" rel="stylesheet">
  <!-- The name in an Indic-style display face, as on the logo (only these letters are downloaded). -->
  <link href="https://fonts.googleapis.com/css2?family=Rozha+One&text=SamaltMir-&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <!-- Hold the page until app.js has put in the text for the chosen language, so a refresh
       doesn't paint empty or English text first and then jump. Shown anyway after 1.5 s. -->
  <script>document.documentElement.setAttribute('data-boot', '');setTimeout(function(){document.documentElement.removeAttribute('data-boot')},1500);</script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/" aria-label="SamaSalt-Mitra home">
      <img class="logo" src="/icon-128.png" width="34" height="34" alt="">
      <span class="wordmark">SamaSalt<span class="wm-mitra">-Mitra</span></span>
    </a>
    <select class="lang-menu" id="langs" aria-label="Language"></select>
  </header>

  <main id="app">
    <section id="home" class="home">
      <h1 data-t="tagline">Same medicine. Lower price.</h1>
      <p class="lede" data-t="intro"></p>

      <button class="primary" id="scanBtn" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.8l1.4-2h6.6l1.4 2h1.8A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.6"/></svg>
        <span data-t="scan">Scan a medicine strip</span>
      </button>
      <!-- The phone camera app and the gallery (chosen in the scan menu below). -->
      <input id="photo" type="file" accept="image/*" capture="environment" hidden>
      <input id="gallery" type="file" accept="image/*" hidden>
      <p class="cam-note" id="camLost" hidden data-t="camLost"></p>
      <p class="scan-alt" id="camLostActions" hidden><button class="link" id="camUseApp" type="button" data-t="camUseApp">Use the in-app camera instead</button></p>
      <p class="hint" data-t="scanHint"></p>
      <!-- Medicines checked so far (kept on this phone only), to show the pharmacist in one go. -->
      <button class="secondary list-btn" id="homeListBtn" type="button" hidden></button>

      <div class="divider"><span data-t="orType">or type the name</span></div>
      <p class="field-note scan-text-tip" data-t="scanTextTip"></p>

      <form id="typeForm" class="group" autocomplete="off">
        <div class="field">
          <input id="nameInput" name="q" type="text" inputmode="text" enterkeyhint="search" data-tp="placeholder" aria-label="Medicine name" maxlength="2000">
          <button type="submit" class="secondary" data-t="check">Check</button>
        </div>
        <div class="field">
          <label for="pinInput" class="cap" data-t="pinShort">PIN code</label>
          <input id="pinInput" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="580020" autocomplete="postal-code">
        </div>
      </form>
      <p class="field-note" data-t="pinHint"></p>

      <div class="volunteer-banner" id="volBanner" hidden data-t="volunteerOn"></div>
    </section>

    <!-- In-app camera: the page stays open (Android may close a tab while its separate camera app runs). -->
    <section id="camera" class="camera" hidden>
      <p class="crop-title" data-t="camTitle">Point the camera at the medicine name and composition</p>
      <p class="cam-note" id="camError" hidden data-t="camDenied"></p>
      <div class="crop-wrap" id="camWrap">
        <div class="cam-stage" id="camStage">
          <video id="camVideo" autoplay playsinline muted></video>
          <div class="cam-guide" aria-hidden="true"></div>
        </div>
      </div>
      <div class="crop-actions">
        <button class="primary" id="camShoot" type="button" data-t="camShoot">Take photo</button>
        <button class="secondary" id="camGallery" type="button" data-t="camGallery">Choose from gallery</button>
        <p class="crop-links"><button class="link" id="camPhone" type="button" data-t="camUsePhone">Use phone camera</button><button class="link" id="camCancel" type="button" data-t="cropCancel">Cancel</button></p>
      </div>
    </section>

    <!-- After a photo: choose the area with the name and composition; only that area is sent. -->
    <section id="crop" class="crop" hidden>
      <p class="crop-title" data-t="cropTitle">Drag the box over the medicine name and composition</p>
      <div class="crop-wrap" id="cropWrap">
        <div class="crop-stage" id="cropStage">
          <div class="crop-box" id="cropBox">
            <span class="h" data-h="tl"></span><span class="h" data-h="tr"></span>
            <span class="h" data-h="bl"></span><span class="h" data-h="br"></span>
          </div>
        </div>
      </div>
      <p class="crop-preview-label" data-t="cropPreview">This is what will be read:</p>
      <div class="crop-wrap"><canvas id="cropPreview" class="crop-preview"></canvas></div>
      <div class="crop-actions">
        <button class="primary" id="cropUse" type="button" data-t="cropUse">Check this area</button>
        <button class="secondary" id="cropFull" type="button" data-t="cropFull">Use the whole photo</button>
        <p class="crop-links">
          <button class="link" id="cropRetake" type="button" data-t="cropRetake">Retake</button>
          <button class="link" id="cropCancel" type="button" data-t="cropCancel">Cancel</button>
        </p>
      </div>
    </section>

    <section id="busy" class="busy" hidden aria-live="polite">
      <img id="thumb" alt="" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p id="busyText"></p>
    </section>

    <section id="result" class="result" hidden aria-live="polite"></section>
  </main>

  <footer class="foot">
    <p data-t="privacy"></p>
    <!-- Developer mode only (?dev=1 to turn on, ?dev=0 to turn off); hidden for patients and volunteers. -->
    <p class="foot-links" id="devLinks" hidden>
      <a href="/impact" data-t="impactLink">See the impact</a>
      <span aria-hidden="true">·</span>
      <a href="/volunteer" data-t="volunteer">Volunteer mode</a>
      <span aria-hidden="true">·</span>
      <a href="https://github.com/dayanandav/SamaSalt-Mitra">GitHub</a>
      <span aria-hidden="true">·</span>
      <a href="/dev">Data import</a>
      <span aria-hidden="true">·</span>
      <a href="/?dev=0">Exit developer mode</a>
    </p>
    <p class="data-note" id="dataNote"></p>
  </footer>

  <!-- "Scan a medicine strip": take a photo or choose one from the gallery. -->
  <dialog id="scanSheet" class="sheet">
    <p class="sheet-title" data-t="scan">Scan a medicine strip</p>
    <div class="crop-actions">
      <button class="primary" id="sheetCamera" type="button" data-t="camShoot">Take photo</button>
      <button class="secondary" id="sheetGallery" type="button" data-t="camGallery">Choose from gallery</button>
      <p class="crop-links"><button class="link" id="sheetInApp" type="button" data-t="camUseApp">Use the in-app camera instead</button></p>
      <form method="dialog" class="crop-links"><button class="link" data-t="cropCancel">Cancel</button></form>
    </div>
  </dialog>

  <!-- Shown to the pharmacist: every medicine checked, by composition, with its Jan Aushadhi code. -->
  <dialog id="pharmacist" class="pharmacist">
    <p class="ph-lead" id="phLead"></p>
    <ol class="ph-list" id="phList"></ol>
    <p class="field-note ph-hint" data-t="listHint"></p>
    <form method="dialog" class="crop-actions"><button class="secondary" data-t="close">Close</button><button class="link" id="phClear" type="button" value="clear" data-t="listClear">Clear list</button></form>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
