<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Kendra QR poster · SamaSalt-Mitra</title>
  <link rel="icon" href="/icon-128.png" type="image/png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 14px; }
    .tools .primary { width: auto; min-height: 44px; padding: 10px 20px; }
    .tools select { font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 10px; border: 0.5px solid var(--line); background: var(--fill); color: var(--text); }
    .poster { background: #fff; color: #111; border-radius: 16px; padding: 28px 24px; display: grid; gap: 14px; justify-items: center; text-align: center;
      max-width: 560px; margin: 0 auto; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 24px rgba(0,0,0,.08); }
    .poster .wm { height: 40px; width: auto; }
    .poster .ptag { font-size: 24px; font-weight: 700; margin: 0; line-height: 1.25; }
    .poster .ptag small { display: block; font-size: 17px; font-weight: 600; color: #333; }
    .poster .qr { width: min(72vw, 320px); aspect-ratio: 1; max-width: 100%; }
    .poster .qr svg { width: 100%; height: 100%; display: block; }
    .poster .scan { font-size: 17px; line-height: 1.4; margin: 0; }
    .poster .scan span { display: block; }
    .poster .scan span + span { color: #333; font-size: 15px; margin-top: 2px; }
    .poster .contact { border: 2px solid #1f3c88; border-radius: 14px; padding: 10px 16px; width: 100%; box-sizing: border-box; }
    .poster .contact .lbl { font-size: 15px; color: #1f3c88; font-weight: 600; }
    .poster .contact .num { font: 700 30px/1.2 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .02em; color: #111; }
    .poster .pickup { background: #fbf0e6; color: #6b3200; border-radius: 12px; padding: 10px 14px; font-size: 15px; line-height: 1.4; margin: 0; width: 100%; box-sizing: border-box; }
    .poster .pickup span { display: block; }
    .poster .kcode { font: 600 15px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #333; margin: 0; }
    .poster .addr { font-size: 13px; color: #555; margin: 0; }
    .poster .url { font-size: 12px; color: #666; margin: 0; }
    .nope { max-width: 560px; margin: 0 auto 14px; padding: 12px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 16px; line-height: 1.45; }
    .pick { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
    .pick label { display: grid; gap: 6px; font-size: 15px; color: var(--muted); }
    .pick input { font: inherit; font-size: 17px; color: var(--text); background: var(--fill); border: 0.5px solid var(--line); border-radius: 12px; padding: 12px; min-height: 48px; box-sizing: border-box; width: 100%; }
    .pick .secondary { width: auto; min-height: 48px; padding: 10px 18px; }
    /* display: grid/flex above would otherwise override the hidden attribute (an empty poster
       card and a Print button showed before the poster was ready). */
    .tools[hidden], .poster[hidden], .pick[hidden], .nope[hidden] { display: none !important; }
    @media print {
      /* One A4 page. When there is no poster to print, the reason is printed instead of a blank page. */
      @page { size: A4 portrait; margin: 10mm; }
      body { background: #fff !important; }
      header.top, .tools, footer, .pick { display: none !important; }
      main { padding: 0 !important; max-width: none !important; }
      .nope { background: none; color: #111; font-size: 18px; }
      .poster { box-shadow: none; max-width: none; padding: 0; gap: 10px; break-inside: avoid; }
      .poster .wm { height: 50px; }
      .poster .ptag { font-size: 30px; } .poster .ptag small { font-size: 22px; }
      .poster .qr { width: 92mm; }
      .poster .scan { font-size: 19px; } .poster .scan span + span { font-size: 17px; }
      .poster .contact { padding: 8px 16px; }
      .poster .contact .num { font-size: 36px; } .poster .contact .lbl { font-size: 17px; }
      .poster .pickup { font-size: 17px; padding: 8px 14px; }
      .poster .kcode, .poster .addr, .poster .url { font-size: 12px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/" aria-label="SamaSalt-Mitra home">
      <img class="logo" src="/icon-128.png" width="34" height="34" alt="">
      <img class="brand-wordmark" src="/assets/SamaSalt-Mitra-Wordmark.svg" alt="SamaSalt-Mitra" width="1178" height="194">
    </a>
  </header>
  <main>
    <div class="tools" id="tools" hidden>
      <button class="primary" id="printBtn" type="button">Print poster</button>
      <label>Second language <select id="second"></select></label>
    </div>
    <p class="nope" id="nope" role="status" hidden></p>
    <!-- Opened without a code, or to check another Kendra: enter the code here. -->
    <form class="pick" id="pick" hidden>
      <label>Kendra code (PMBJK…)<input id="pickCode" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" placeholder="PMBJK00964"></label>
      <button class="secondary" type="submit">Open poster</button>
    </form>
    <article class="poster" id="poster" hidden>
      <img class="wm" src="/assets/SamaSalt-Mitra-Wordmark.svg" alt="SamaSalt-Mitra" width="1178" height="194">
      <p class="ptag" id="pTag"></p>
      <div class="qr" id="pQr" role="img" aria-label="QR code"></div>
      <p class="scan" id="pScan"></p>
      <div class="contact"><div class="lbl" id="pContactLbl"></div><div class="num" id="pNum"></div></div>
      <p class="pickup" id="pPickup"></p>
      <p class="kcode" id="pCode"></p>
      <p class="addr" id="pAddr"></p>
      <p class="url" id="pUrl"></p>
    </article>
  </main>
  <footer class="foot"><p><a href="/kendra">Kendra registration</a></p></footer>
  <script src="/vendor/qrcode.js"></script>
  <script type="module" src="/poster.js"></script>
  <script src="/envbanner.js"></script>
</body>
</html>
